<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">FlipKart</div>

        <div class="search">
            <input type="text" placeholder="Search for products, brands and more">
            <button>🔍</button>
        </div>

        <div class="nav-links">
            <span>Account</span>
            <span>More</span>
            <span>🛒 Cart</span>
        </div>
    </header>

    <div class="breadcrumb">
        Home / Bags / Laptop Bags / Laptop Sleeves / Product
    </div>

    <main class="product-container">

        <section class="product-images">

            <div class="image-box large">
                <img src="IMAGE 1" alt="Product">
            </div>

            <div class="image-box">
                <img src="IMAGE 2" alt="Product">
            </div>

            <div class="image-box">
                <img src="IMAGE 3" alt="Product">
            </div>

            <div class="image-box">
                <img src="IMAGE 4" alt="Product">
            </div>

        </section>

        <section class="product-details">
            <p class="brand">Brand Store</p>
            <h1>
                Stylish Laptop Sleeve for MacBook and Laptop
            </h1>

            <div class="rating">
                ⭐ 4.4 &nbsp; | &nbsp; 73 Ratings
            </div>
            <hr>
            <p class="label">Color</p>

            <div class="colors">
                <div class="color blue"></div>
                <div class="color brown"></div>
                <div class="color green"></div>
                <div class="color red"></div>
                <div class="color yellow selected"></div>
            </div>
            <p class="label">Capacity</p>
            <button class="capacity">12 L</button>
            <div class="price">
                <span class="discount">32% OFF</span>
                <span class="old-price">₹2,199</span>
                <span class="current-price">₹1,499</span>
            </div>
            <div class="offer">
                <strong>Special Offer</strong>
                <p>Get extra discount with coupon</p>
                <button>Apply Coupon</button>
            </div>
            <div class="buttons">
                <button class="cart-btn">Add to Cart</button>
                <button class="buy-btn">Buy Now</button>
            </div>
        </section>

    </main>

</body>
</html>
